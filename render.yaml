services:
  - type: web
    name: model-cost-performance
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m compileall -q web_app.py
    startCommand: python web_app.py
    healthCheckPath: /healthz
    envVars:
      # Render generates a shared password; share it only with intended viewers.
      # Add OPENROUTER_API_KEY only if you intend to use billable live responses.
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: AUTO_OPEN_BROWSER
        value: "0"
      - key: DB_PATH
        value: /tmp/model-cost-performance.sqlite3
